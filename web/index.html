<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Camera Manager Pro</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/custom.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-camera-video me-2"></i>
                Camera Manager Pro
            </a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text" id="status-indicator">
                    <i class="bi bi-circle-fill text-secondary me-1"></i>
                    <span id="status-text">Starting...</span>
                </span>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid mt-3">
        <!-- Tab Navigation -->
        <ul class="nav nav-tabs" id="mainTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="main-tab" data-bs-toggle="tab" data-bs-target="#main-pane" 
                        type="button" role="tab" aria-controls="main-pane" aria-selected="true">
                    <i class="bi bi-play-circle me-2"></i>Live Stream
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="settings-tab" data-bs-toggle="tab" data-bs-target="#settings-pane" 
                        type="button" role="tab" aria-controls="settings-pane" aria-selected="false">
                    <i class="bi bi-gear me-2"></i>Camera Settings
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="calibration-tab" data-bs-toggle="tab" data-bs-target="#calibration-pane" 
                        type="button" role="tab" aria-controls="calibration-pane" aria-selected="false">
                    <i class="bi bi-bullseye me-2"></i>Calibration
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content" id="mainTabContent">
            <!-- Live Stream Tab -->
            <div class="tab-pane fade show active" id="main-pane" role="tabpanel" aria-labelledby="main-tab">
                <div class="row mt-3">
                    <div class="col-12">
                        <!-- Controls -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="row align-items-center">
                                    <div class="col-md-6">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="global-tracking-toggle">
                                            <label class="form-check-label" for="global-tracking-toggle">
                                                <i class="bi bi-diagram-3 me-2"></i>Global Stereo Tracking
                                            </label>
                                        </div>
                                    </div>
                                    <div class="col-md-6 text-end">
                                        <button class="btn btn-outline-danger btn-sm" id="clear-memory-btn">
                                            <i class="bi bi-trash me-1"></i>Clear Memory
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Video Grid -->
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-camera-video-fill me-2"></i>Camera Feeds
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="video-mosaic" class="row g-3"></div>
                                <div id="no-cameras" class="text-center py-5 text-muted" style="display: none;">
                                    <i class="bi bi-camera-video-off display-1"></i>
                                    <p class="mt-2">No active detection cameras</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings Tab -->
            <div class="tab-pane fade" id="settings-pane" role="tabpanel" aria-labelledby="settings-tab">
                <div class="row mt-3">
                    <div class="col-md-8">
                        <!-- Configured Cameras -->
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-camera-fill me-2"></i>Configured Cameras
                                </h5>
                                <button class="btn btn-primary btn-sm" id="stereo-runtime-btn">
                                    <i class="bi bi-diagram-3 me-1"></i>Stereo Settings
                                </button>
                            </div>
                            <div class="card-body">
                                <p class="text-muted small mb-2">Use the role dropdown to assign each camera's purpose.</p>
                                <div id="configured-cameras"></div>
                            </div>
                        </div>

                        <!-- New Cameras -->
                        <div class="card mt-3">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-camera-plus me-2"></i>New Cameras
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="new-cameras"></div>
                                <div id="no-new-cameras" class="text-center py-3 text-muted" style="display: none;">
                                    <i class="bi bi-camera display-4"></i>
                                    <p class="mt-2">No new cameras detected</p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <!-- Advanced Settings Panel -->
                        <div id="advanced-settings" class="card" style="display: none;">
                            <div class="card-header">
                                <h6 class="card-title mb-0">
                                    <i class="bi bi-sliders me-2"></i>Advanced Settings
                                </h6>
                            </div>
                            <div class="card-body" id="advanced-settings-content">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Calibration Tab -->
            <div class="tab-pane fade" id="calibration-pane" role="tabpanel" aria-labelledby="calibration-tab">
                <div class="row mt-3">
                    <div class="col-md-8">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="card-title mb-0">
                                    <i class="bi bi-bullseye me-2"></i>Camera Calibration
                                </h5>
                            </div>
                            <div class="card-body">
                                <div id="calibration-content"></div>
                            </div>
                        </div>

                        <!-- Calibration Preview -->
                        <div class="card mt-3">
                            <div class="card-header">
                                <h6 class="card-title mb-0">
                                    <i class="bi bi-camera-reels me-2"></i>Camera Preview
                                </h6>
                            </div>
                            <div class="card-body">
                                <div id="calibration-preview" class="row g-3"></div>
                            </div>
                        </div>
                    </div>

                    <div class="col-md-4">
                        <!-- Calibration Parameters -->
                        <div class="card">
                            <div class="card-header">
                                <h6 class="card-title mb-0">
                                    <i class="bi bi-gear me-2"></i>Parameters
                                </h6>
                            </div>
                            <div class="card-body">
                                <div id="calibration-parameters"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Global Object Tracker (Floating Panel) -->
    <div id="global-tracker-panel" class="floating-panel" style="display: none;">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h6 class="card-title mb-0">
                    <i class="bi bi-crosshair me-2"></i>Tracked Objects
                </h6>
                <button class="btn-close btn-sm" id="close-tracker-panel"></button>
            </div>
            <div class="card-body" id="global-tracker-content">
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="modals-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS Modules -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui-helpers.js"></script>
    <script src="js/main-tab.js"></script>
    <script src="js/settings-tab.js"></script>
    <script src="js/calibration-tab.js"></script>
    <script src="js/global-tracker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
