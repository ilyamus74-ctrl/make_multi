# Copy this file to launcher.cfg and tune limits/ports as needed.
# Values here are loaded by launcher.sh before defaults are applied.

# Camera command limits (degrees / steps)
CMD_MAX_PAN=20
CMD_MAX_TILT=20
CMD_MAX_ZOOM=34

# Optional transport settings
# UART_DEV=/dev/ttyUSB0
# UART_BAUD=115200
# WS_PORT=8765

# Zoom calibration (time + image) performed by mjpeg_gst_http at startup.
# Uses UART directly before ws_bridge starts.
# ZOOM_CALIB_ENABLE=1
# ZOOM_CALIB_UART_DEV=/dev/ttyUSB0
# ZOOM_CALIB_UART_BAUD=115200

AUTOPILOT_ENABLE=1
AUTOPILOT_REQUIRED=0
AUTOPILOT_PORT=8090
AUTOPILOT_HZ=10
AUTOPILOT_KP=18
AUTOPILOT_KI=0
AUTOPILOT_KD=1.5
AUTOPILOT_DEADZONE=0.05
AUTOPILOT_MAX_ACCEL=4
AUTOPILOT_INVERT_TILT=1
FPS=15
MAX_DETECTIONS=5
MAX_RAW_CANDIDATES=10

